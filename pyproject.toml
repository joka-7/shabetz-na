[project]
name = "shabetz-na"
version = "0.1.0"
description = "Configurable personnel scheduling orchestration system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pymysql>=1.1.1",
    "cryptography>=43.0",
    "argon2-cffi>=23.1",
    "authlib>=1.3.2",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "typer>=0.15",
    "openpyxl>=3.1",
    "defusedxml>=0.7",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
# The Windows desktop app: a native window, and the tool that bundles it.
desktop = ["pywebview>=5.3"]
build = ["pyinstaller>=6.10"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyMySQL",
    "types-openpyxl",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
shabetz = "shabetz.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shabetz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires a live MySQL database"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["shabetz"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Optional extra: absence is detected and handled at runtime, so a missing
# stub must not fail the typecheck of a default install.
module = ["weasyprint.*", "webview.*"]
ignore_missing_imports = true
